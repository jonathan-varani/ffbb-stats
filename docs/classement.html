<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FFBB Stats — Classement des marqueurs</title>
<style>
  :root{
    --bg:#f6f7f9; --panel:#ffffff; --ink:#16181d; --muted:#666e7a;
    --line:#e2e5ea; --accent:#d4552b; --accent-ink:#fff;
    --gold:#b8860b; --silver:#7a8087; --bronze:#a9662d;
    --shadow:0 1px 3px rgba(0,0,0,.08);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#15171b; --panel:#1d2025; --ink:#e9eaec; --muted:#9aa1ab;
      --line:#2c3037; --accent:#e4693f; --shadow:0 1px 3px rgba(0,0,0,.4);
      --gold:#d9a441; --silver:#a7adb6; --bronze:#c4794a;
    }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;}
  header{display:flex;align-items:center;gap:16px;padding:18px 20px;
    border-bottom:1px solid var(--line);background:var(--panel);flex-wrap:wrap}
  header h1{font-size:17px;margin:0;font-weight:600}
  header .badge{font-size:12px;color:var(--muted);font-weight:400}
  nav{margin-left:auto;display:flex;gap:14px}
  nav a{color:var(--muted);text-decoration:none;font-size:13px}
  nav a:hover{color:var(--ink)}
  main{max-width:980px;margin:0 auto;padding:20px}
  section{background:var(--panel);border:1px solid var(--line);border-radius:10px;
    padding:18px;margin-bottom:18px;box-shadow:var(--shadow)}
  h2{font-size:14px;margin:0 0 14px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
  .filters{display:flex;gap:12px;flex-wrap:wrap;align-items:end}
  .field{display:flex;flex-direction:column;gap:4px;min-width:160px;flex:1}
  .field label{font-size:12px;color:var(--muted)}
  select,input[type=search]{width:100%;padding:8px 10px;border-radius:7px;
    border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit}
  button{font:inherit;cursor:pointer;border-radius:7px;border:1px solid var(--line);
    background:var(--panel);color:var(--ink);padding:8px 14px}
  button.ghost{border-color:transparent;color:var(--muted)}
  .tblwrap{overflow-x:auto}
  table{width:100%;border-collapse:collapse;font-size:14px;min-width:720px}
  th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
  th{font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase;
    letter-spacing:.03em;cursor:pointer;user-select:none}
  th.active{color:var(--ink)}
  th .arrow{opacity:.5;margin-left:2px}
  td.rank{font-variant-numeric:tabular-nums;font-weight:600;width:36px}
  td.rank.gold{color:var(--gold)} td.rank.silver{color:var(--silver)} td.rank.bronze{color:var(--bronze)}
  td.joueur{font-weight:600;white-space:normal}
  td.num{text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
  td.num.hi{color:var(--ink);font-weight:600}
  .msg{margin-top:12px;font-size:14px;color:var(--muted)}
  .msg.err{color:#b3261e}
  .hint{font-size:12px;color:var(--muted);margin-top:8px}
  .col-toggle{display:flex;gap:6px;flex-wrap:wrap;margin-top:14px}
  .col-toggle button{padding:5px 10px;font-size:12px}
  .col-toggle button.on{background:var(--accent);color:var(--accent-ink);border-color:transparent}
  td.detail, th.detail{display:none}
  table.detailed td.detail, table.detailed th.detail{display:table-cell}
</style>
</head>
<body>
<header>
  <h1>FFBB Stats <span class="badge">— classement des marqueurs</span></h1>
  <nav><a href="index.html">Archive e-Marque</a></nav>
</header>

<main>
  <section>
    <h2>Filtres</h2>
    <div class="filters">
      <div class="field">
        <label for="fChamp">Championnat</label>
        <select id="fChamp"><option value="">Tous</option></select>
      </div>
      <div class="field">
        <label for="fPoule">Poule</label>
        <select id="fPoule"><option value="">Toutes</option></select>
      </div>
      <div class="field">
        <label for="fEquipe">Équipe</label>
        <select id="fEquipe"><option value="">Toutes</option></select>
      </div>
      <div class="field">
        <label for="fSearch">Joueur</label>
        <input id="fSearch" type="search" placeholder="Nom ou prénom…">
      </div>
      <button id="reset" class="ghost">Réinitialiser</button>
    </div>
    <div class="col-toggle">
      <button id="toggleDetail">+ Détails (2pts / 3pts / LF / rebonds / passes / fautes)</button>
    </div>
  </section>

  <section>
    <h2>Meilleurs marqueurs</h2>
    <div class="tblwrap">
      <table id="tbl">
        <thead>
          <tr>
            <th data-sort="rank">#</th>
            <th data-sort="joueur">Joueur</th>
            <th data-sort="equipe_nom">Équipe</th>
            <th data-sort="matchs_joues" class="num">MJ</th>
            <th data-sort="points_total" class="num active">Points<span class="arrow">▼</span></th>
            <th data-sort="moyenne_points" class="num">Moy./match</th>
            <th data-sort="deux_pts_reussis" class="num detail">2 pts</th>
            <th data-sort="trois_pts_reussis" class="num detail">3 pts</th>
            <th data-sort="lf_reussis" class="num detail">LF</th>
            <th data-sort="rebonds_total" class="num detail">Reb.</th>
            <th data-sort="passes_decisives" class="num detail">Passes</th>
            <th data-sort="fautes_personnelles" class="num detail">Fautes</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
    <div id="msg" class="msg">Chargement…</div>
    <p class="hint">Classement basé sur les réussites (le PDF e-Marque ne fournit pas les tentatives, donc pas de % de réussite).</p>
  </section>
</main>

<script>
// Clé anon (publique par conception) et URL du projet — lecture seule,
// protégée par les GRANT côté base (voir scripts/classement.sql).
const SUPABASE_URL = 'https://xbaoyelmtzpxwqdxkync.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhiYW95ZWxtdHpweHdxZHhreW5jIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkzMjY2NjIsImV4cCI6MjEwNDkwMjY2Mn0.6iy15Pz9lfwOJiYE2kDk8Gimi4bXTrEstcgLmHeWmiI';

const $ = id => document.getElementById(id);
const rest = (path) => `${SUPABASE_URL}/rest/v1/${path}`;
const HEADERS = { apikey: SUPABASE_ANON_KEY, Authorization: `Bearer ${SUPABASE_ANON_KEY}` };

let rows = [];
let sortKey = 'points_total';
let sortDir = -1;

async function loadFiltres(){
  const champs = await fetch(rest('v_championnats?select=championnat'), {headers: HEADERS}).then(r => r.json());
  champs.forEach(c => $('fChamp').add(new Option(c.championnat, c.championnat)));

  const equipes = await fetch(rest('equipes?select=nom&order=nom'), {headers: HEADERS}).then(r => r.json());
  equipes.forEach(e => $('fEquipe').add(new Option(e.nom, e.nom)));

  await loadPoules();
}

async function loadPoules(){
  const champ = $('fChamp').value;
  const prevPoule = $('fPoule').value;
  $('fPoule').innerHTML = '<option value="">Toutes</option>';
  let url = 'v_poules?select=championnat,poule';
  if(champ) url += '&championnat=eq.' + encodeURIComponent(champ);
  const poules = await fetch(rest(url), {headers: HEADERS}).then(r => r.json());
  const seen = new Set();
  poules.forEach(p => {
    if(seen.has(p.poule)) return;
    seen.add(p.poule);
    $('fPoule').add(new Option(p.poule, p.poule));
  });
  if([...$('fPoule').options].some(o => o.value === prevPoule)) $('fPoule').value = prevPoule;
}

async function loadClassement(){
  $('msg').textContent = 'Chargement…';
  $('msg').className = 'msg';
  const body = {
    p_championnat: $('fChamp').value || null,
    p_poule: $('fPoule').value || null,
    p_equipe: $('fEquipe').value || null,
  };
  try {
    const res = await fetch(rest('rpc/classement_marqueurs'), {
      method: 'POST',
      headers: Object.assign({'Content-Type':'application/json'}, HEADERS),
      body: JSON.stringify(body)
    });
    if(!res.ok){
      $('msg').textContent = 'Erreur ' + res.status + ' : ' + (await res.text()).slice(0,200);
      $('msg').className = 'msg err';
      rows = [];
      render();
      return;
    }
    rows = await res.json();
    $('msg').textContent = rows.length ? '' : 'Aucun joueur pour ces filtres.';
    render();
  } catch(e){
    $('msg').textContent = 'Erreur réseau : ' + e.message;
    $('msg').className = 'msg err';
  }
}

function matchesSearch(r, q){
  if(!q) return true;
  q = q.toLowerCase();
  return (r.nom || '').toLowerCase().includes(q) || (r.prenom || '').toLowerCase().includes(q);
}

function render(){
  const q = $('fSearch').value.trim();
  const filtered = rows.filter(r => matchesSearch(r, q));
  filtered.sort((a, b) => {
    const va = a[sortKey], vb = b[sortKey];
    if(typeof va === 'string') return sortDir * va.localeCompare(vb);
    return sortDir * ((va ?? 0) - (vb ?? 0));
  });

  const tb = $('tbl').querySelector('tbody');
  tb.innerHTML = '';
  filtered.forEach((r, i) => {
    const rank = i + 1;
    const tr = document.createElement('tr');
    const rankCls = rank === 1 ? 'gold' : rank === 2 ? 'silver' : rank === 3 ? 'bronze' : '';
    tr.innerHTML = `
      <td class="rank ${rankCls}">${rank}</td>
      <td class="joueur">${r.prenom || ''} ${r.nom || ''}</td>
      <td>${r.equipe_nom || ''}</td>
      <td class="num">${r.matchs_joues}</td>
      <td class="num hi">${r.points_total}</td>
      <td class="num">${r.moyenne_points}</td>
      <td class="num detail">${r.deux_pts_reussis}</td>
      <td class="num detail">${r.trois_pts_reussis}</td>
      <td class="num detail">${r.lf_reussis}</td>
      <td class="num detail">${r.rebonds_total}</td>
      <td class="num detail">${r.passes_decisives}</td>
      <td class="num detail">${r.fautes_personnelles}</td>
    `;
    tb.appendChild(tr);
  });

  document.querySelectorAll('th[data-sort]').forEach(th => {
    th.classList.toggle('active', th.dataset.sort === sortKey);
    th.querySelector('.arrow')?.remove();
    if(th.dataset.sort === sortKey){
      const span = document.createElement('span');
      span.className = 'arrow';
      span.textContent = sortDir === -1 ? '▼' : '▲';
      th.appendChild(span);
    }
  });
}

document.querySelectorAll('th[data-sort]').forEach(th => {
  th.addEventListener('click', () => {
    const key = th.dataset.sort;
    if(key === 'rank') return;
    if(sortKey === key) sortDir *= -1;
    else { sortKey = key; sortDir = -1; }
    render();
  });
});

$('fChamp').addEventListener('change', async () => { await loadPoules(); loadClassement(); });
$('fPoule').addEventListener('change', loadClassement);
$('fEquipe').addEventListener('change', loadClassement);
$('fSearch').addEventListener('input', render);
$('reset').addEventListener('click', () => {
  $('fChamp').value = ''; $('fPoule').value = ''; $('fEquipe').value = ''; $('fSearch').value = '';
  loadPoules().then(loadClassement);
});
$('toggleDetail').addEventListener('click', (e) => {
  const on = $('tbl').classList.toggle('detailed');
  e.target.classList.toggle('on', on);
});

loadFiltres().then(loadClassement);
</script>
</body>
</html>
